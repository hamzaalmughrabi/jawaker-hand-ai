[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jawaker-hand-ai"
version = "0.1.0"
description = "Specialized AI System for Jawaker Hand (هاند جواكر) with 106-card deck, Bayesian Opponent Modeling, ISMCTS, TD-Learning, and Obsidian Knowledge Vault"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[project.scripts]
jawaker-hand-ai = "jawaker_hand_ai.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
